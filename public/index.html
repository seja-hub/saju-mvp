<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>야장하기 좋은데이 사주풀이</title>
<style>
  :root{
    --navy:#003087; --navy-d:#001f57; --blue:#004ea8;
    --bg:#eef1f7; --card:#ffffff; --ink:#1c1c1a; --sub:#5f6b7a; --line:#dce2ec;
    --pink:#c65b6e; --purple:#6b4fa0; --gold:#b08a3e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    line-height:1.65; padding:0 0 48px;}
  .wrap{max-width:440px; margin:0 auto; padding:0 18px;}
  header{text-align:center; padding:30px 0 16px;}
  .badge{display:inline-block; background:var(--navy); color:#fff; font-size:12.5px; font-weight:700;
    letter-spacing:.5px; padding:7px 14px; border-radius:999px; margin-bottom:13px;}
  header h1{font-size:26px; margin:2px 0 6px; font-weight:800; color:var(--navy);}
  header p{margin:0; color:var(--sub); font-size:13.5px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:20px; margin:14px 0; box-shadow:0 1px 3px rgba(0,32,87,.05);}
  label{display:block; font-size:13px; font-weight:700; margin:0 0 6px; color:var(--ink);}
  .field{margin-bottom:15px;}
  input,select{width:100%; padding:13px 12px; font-size:16px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); appearance:none;}
  input:focus,select:focus{outline:none; border-color:var(--navy);}
  .seg{display:flex; gap:8px; flex-wrap:wrap;}
  .seg button{flex:1; min-width:60px; padding:11px 0; border:1px solid var(--line); background:#fff;
    border-radius:10px; font-size:14px; color:var(--sub); cursor:pointer; font-weight:600;}
  .seg button.on{border-color:var(--navy); background:var(--navy); color:#fff;}
  .btn{width:100%; padding:15px; font-size:16px; font-weight:800; color:#fff;
    background:var(--navy); border:none; border-radius:12px; cursor:pointer;}
  .btn:active{background:var(--navy-d);}
  .btn:disabled{opacity:.55;}
  .btn.purpleB{background:var(--purple);}
  .hint{font-size:12px; color:var(--sub); margin:6px 2px 0;}

  #result{display:none;}
  .saju-card{background:linear-gradient(180deg,#ffffff,#eaf0fa); border:1px solid var(--line);
    border-radius:16px; padding:22px 18px; text-align:center;}
  .saju-card .date{font-size:12px; color:var(--sub); letter-spacing:1px;}
  .pillars{display:flex; justify-content:center; gap:10px; margin:14px 0 6px;}
  .pillar{flex:1; max-width:74px;}
  .pillar .hanja{font-size:30px; font-weight:800; color:var(--navy);
    font-family:"Apple SD Gothic Neo",serif; line-height:1.1;}
  .pillar .role{font-size:11px; color:var(--sub); margin-top:5px;}
  .pillar .kr{font-size:12px; color:var(--ink);}
  .ilgan{margin-top:10px; font-size:13px; color:var(--navy); font-weight:700;}
  .ohaeng{font-size:12px; color:var(--sub); margin-top:4px;}
  .desc{font-size:15px; margin:16px 2px 4px; text-align:left;}
  .desc p, .box p{margin:0 0 11px;} .desc p:last-child, .box p:last-child{margin:0;}

  h2.sec{font-size:14px; color:var(--sub); margin:26px 2px 10px; font-weight:700;}
  .wide{width:100%; padding:15px; border-radius:12px; font-size:15.5px; font-weight:800; cursor:pointer; margin-bottom:10px;}
  .wide.month{background:var(--navy); color:#fff; border:none;}
  .wide.month.on{box-shadow:0 0 0 3px rgba(0,48,135,.22);}
  .wide.persona{background:var(--purple); color:#fff; border:none;}
  .wide.persona.on{box-shadow:0 0 0 3px rgba(107,79,160,.25);}
  .wide.gung{background:#fff; color:var(--pink); border:1.5px solid var(--pink);}
  .wide.gung.on{background:var(--pink); color:#fff;}
  .wide.group{background:#fff; color:var(--gold); border:1.5px solid var(--gold);}
  .wide.group.on{background:var(--gold); color:#fff;}
  .cats{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:10px;}
  .cat{padding:14px 0; border:1px solid var(--line); background:var(--card); border-radius:12px;
    font-size:14.5px; font-weight:700; color:var(--navy); cursor:pointer; text-align:center;}
  .cat.on{background:var(--navy); color:#fff; border-color:var(--navy);}

  .panel{display:none; border-radius:14px; padding:16px; margin-bottom:10px;}
  .panel.show{display:block;}
  .panel .p-title{font-size:13.5px; font-weight:800; margin-bottom:12px;}
  #partner{background:#fff7f8; border:1px solid #f0d9dd;}
  #partner .p-title{color:var(--pink);}
  #partner .btn{background:var(--pink);} #partner .btn:active{background:#a8485a;}
  #partner .seg button.on{background:var(--pink); border-color:var(--pink);}
  #gpanel{background:#fbf8f0; border:1px solid #e8ddc2;}
  #gpanel .p-title{color:var(--gold);}
  #gpanel .p-title .cnt{float:right; font-weight:700; color:var(--sub); font-size:12.5px;}
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:13px;}
  .chip{background:#fff; border:1px solid var(--line); border-radius:999px; padding:7px 12px;
    font-size:13px; font-weight:600; color:var(--ink);}
  .chip b{color:var(--navy);}
  .chip.me{background:var(--navy); border-color:var(--navy); color:#fff;}
  .chip.me b{color:#fff;}
  .chip .x{margin-left:7px; color:#b0413e; cursor:pointer; font-weight:800;}
  .row2{display:flex; gap:8px; margin-bottom:9px;}
  .btn.small{padding:12px 0; font-size:14px; border-radius:10px;}
  .btn.addBtn{background:var(--gold);} .btn.addBtn:active{background:#8f6e2e;}

  .answer{margin-top:14px;}
  .answer .box{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--navy);
    border-radius:12px; padding:16px; font-size:15px;}
  .answer .box.g{border-left-color:var(--pink);}
  .answer .box.p{border-left-color:var(--purple);}
  .answer .box.o{border-left-color:var(--gold);}
  .answer .t{font-weight:800; color:var(--navy); margin-bottom:9px; font-size:14px;}
  .answer .box.g .t{color:var(--pink);} .answer .box.p .t{color:var(--purple);} .answer .box.o .t{color:var(--gold);}
  .pair-head{font-size:13px; color:var(--ink); background:#fff; border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; margin-bottom:11px; text-align:center; font-weight:700;}
  .loading{color:var(--sub); font-size:14px; padding:10px 2px;}
  .dot{display:inline-block; animation:b 1.2s infinite;}
  .dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
  @keyframes b{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  .reset{display:block; margin:22px auto 0; background:none; border:none; color:var(--sub);
    font-size:13px; text-decoration:underline; cursor:pointer;}
  footer{text-align:center; color:var(--sub); font-size:11.5px; margin-top:30px; line-height:1.7;}
  footer b{color:var(--navy); font-weight:700;}
  .err{color:#b0413e; font-size:13.5px; padding:10px 2px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">🍶 야장하기 좋은데이 사주풀이</div>
    <h1>오늘의 사주 한 잔</h1>
    <p>생년월일만 넣으면, 진짜 사주로 풀어드려요</p>
  </header>

  <div class="card" id="form">
    <div class="field">
      <label>이름 <span style="color:var(--sub);font-weight:400">(선택)</span></label>
      <input id="name" type="text" placeholder="닉네임도 좋아요" maxlength="20" />
    </div>
    <div class="field">
      <label>성별 <span style="color:var(--sub);font-weight:400">(선택)</span></label>
      <div class="seg" id="genderSeg">
        <button data-g="남">남</button><button data-g="여">여</button>
        <button data-g="" class="on">선택 안 함</button>
      </div>
    </div>
    <div class="field">
      <label>생년월일 (양력)</label>
      <input id="birth" type="date" min="1920-01-01" />
      <div class="hint">음력만 아는 경우는 음력→양력 변환 후 입력해 주세요.</div>
    </div>
    <div class="field">
      <label>태어난 시간</label>
      <select id="hour"><option value="unknown" selected>시간 모름</option></select>
      <div class="hint">시간을 모르면 ‘시간 모름’ 그대로 둬도 돼요.</div>
    </div>
    <button class="btn" id="go">내 사주 보기 →</button>
    <div class="err" id="formErr" style="display:none"></div>
  </div>

  <div id="result">
    <div class="saju-card">
      <div class="date" id="rDate"></div>
      <div class="pillars" id="rPillars"></div>
      <div class="ilgan" id="rIlgan"></div>
      <div class="ohaeng" id="rOhaeng"></div>
      <div class="desc" id="rDesc"></div>
    </div>

    <h2 class="sec">어떤 운이 궁금해요?</h2>

    <button class="wide month" id="btnMonth"></button>
    <div class="cats" id="cats"></div>
    <button class="wide persona" id="btnPersona">🧬 에겐·테토 판독기 — 나는 에겐? 테토?</button>

    <button class="wide gung" id="btnGung">💞 1:1 궁합 (연인·썸·친구)</button>
    <div class="panel" id="partner">
      <div class="p-title">상대방 정보를 넣어주세요</div>
      <div class="field" style="margin-bottom:12px">
        <label>관계</label>
        <div class="seg" id="relSeg">
          <button data-r="연인" class="on">연인</button><button data-r="썸">썸</button>
          <button data-r="친구">친구</button><button data-r="동료">동료</button>
        </div>
      </div>
      <div class="field" style="margin-bottom:12px">
        <label>상대 생년월일 (양력)</label>
        <input id="pBirth" type="date" min="1920-01-01" />
      </div>
      <div class="field" style="margin-bottom:14px">
        <label>상대 태어난 시간</label>
        <select id="pHour"><option value="unknown" selected>시간 모름</option></select>
      </div>
      <button class="btn" id="goGung">궁합 보기 →</button>
    </div>

    <button class="wide group" id="btnGroup">👥 단체 케미 판독 (최대 10명)</button>
    <div class="panel" id="gpanel">
      <div class="p-title">모인 멤버를 추가해주세요 <span class="cnt" id="gCount">1/10</span></div>
      <div class="chips" id="gChips"></div>
      <div class="row2">
        <input id="gName" type="text" placeholder="이름/별명" maxlength="10" style="flex:1" />
        <input id="gBirth" type="date" min="1920-01-01" style="flex:1.5" />
      </div>
      <div class="row2">
        <select id="gHour" style="flex:1"><option value="unknown" selected>시간 모름</option></select>
        <button class="btn small addBtn" id="gAdd" style="flex:.6">＋ 추가</button>
      </div>
      <button class="btn" id="goGroup">🍻 단체 궁합 보기 →</button>
      <button class="btn purpleB" id="goGroupPersona" style="margin-top:8px">🧬 에겐·테토 단체 판독 →</button>
      <div class="hint">전원의 생년월일만 있으면 돼요 · 분석에 10~30초 걸릴 수 있어요</div>
    </div>

    <div class="answer" id="answer"></div>
    <button class="reset" id="reset">처음부터 다시</button>
  </div>

  <footer>
    재미로 보는 콘텐츠예요 · 만 19세 이상<br>
    <b>무학 좋은데이</b>와 함께 · 사주팔자는 한국천문연구원 만세력 기준으로 계산됩니다
  </footer>
</div>

<script>
  const sijin = ["子자시","丑축시","丑축시","寅인시","寅인시","卯묘시","卯묘시","辰진시","辰진시","巳사시","巳사시","午오시","午오시","未미시","未미시","申신시","申신시","酉유시","酉유시","戌술시","戌술시","亥해시","亥해시","子자시"];
  function fillHours(sel){
    for(let h=0; h<24; h++){
      const o=document.createElement('option'); o.value=h;
      const h12=(h%12)===0?12:h%12;
      o.textContent=`${String(h).padStart(2,'0')}시 (${h<12?'오전':'오후'} ${h12}시·${sijin[h]})`;
      sel.appendChild(o);
    }
  }
  fillHours(document.getElementById('hour'));
  fillHours(document.getElementById('pHour'));
  fillHours(document.getElementById('gHour'));

  let gender="", relation="연인";
  function seg(id,set){ document.querySelectorAll(`#${id} button`).forEach(b=>{ b.onclick=()=>{
    document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove('on')); b.classList.add('on'); set(b);
  };});}
  seg('genderSeg', b=>gender=b.dataset.g);
  seg('relSeg', b=>relation=b.dataset.r);

  const MONTH = new Date().getMonth()+1;
  document.getElementById('btnMonth').textContent = `🗓️ ${MONTH}월 운세 — 이번 달 기회와 조심할 것`;

  const CATS = ["총운","연애운","결혼운","금전운","직업운","건강운"];
  let payload=null; const cache={};
  let groupMembers=[]; // '나' 제외 추가 멤버

  function dots(msg){ return `<span class="loading">${msg||'풀이 중'}<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>`; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function fmt(p){ return esc(p).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
  function paras(text){ return text.split(/\n{2,}/).map(p=>`<p>${fmt(p)}</p>`).join(''); }
  function box(title,text,color){ return `<div class="box${color?' '+color:''}"><div class="t">${title}</div>${paras(text)}</div>`; }

  async function callAPI(extra){
    const res = await fetch('/api/reading',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...payload, ...extra})});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error||'오류가 발생했어요');
    return data;
  }

  document.getElementById('go').onclick = async ()=>{
    const birth=document.getElementById('birth').value;
    const errEl=document.getElementById('formErr'); errEl.style.display='none';
    if(!birth){ errEl.textContent='생년월일을 입력해 주세요.'; errEl.style.display='block'; return; }
    const [y,m,d]=birth.split('-').map(Number);
    const hv=document.getElementById('hour').value;
    payload={ name:document.getElementById('name').value.trim(), gender, year:y,month:m,day:d,
      hourUnknown:hv==='unknown', hour:hv==='unknown'?12:Number(hv), minute:0 };
    const btn=document.getElementById('go'); btn.disabled=true; btn.textContent='사주 푸는 중...';
    try{
      const data=await callAPI({section:'profile'});
      renderProfile(data);
      document.getElementById('form').style.display='none';
      document.getElementById('result').style.display='block';
      window.scrollTo({top:0,behavior:'smooth'});
    }catch(e){ errEl.textContent=e.message; errEl.style.display='block'; }
    finally{ btn.disabled=false; btn.textContent='내 사주 보기 →'; }
  };

  function renderProfile(data){
    const s=data.saju; const order=['년주','월주','일주','시주'];
    document.getElementById('rDate').textContent =
      `${payload.year}. ${String(payload.month).padStart(2,'0')}. ${String(payload.day).padStart(2,'0')}`
      + (s.시간보정?`  ·  진태양시 ${s.시간보정.hour}:${String(s.시간보정.minute).padStart(2,'0')} 보정`:'');
    document.getElementById('rPillars').innerHTML = order.map(k=>{
      const p=s.pillars[k];
      return p ? `<div class="pillar"><div class="hanja">${p.hanja}</div><div class="role">${k}</div><div class="kr">${p.hangul}</div></div>`
               : `<div class="pillar"><div class="hanja" style="color:#c3cde0">—</div><div class="role">${k}</div><div class="kr">시간 모름</div></div>`;
    }).join('');
    document.getElementById('rIlgan').textContent = `일간 ${s.일간.hangul}${s.일간.hanja} · ${s.일간.오행}(${s.일간.음양})의 기운`;
    document.getElementById('rOhaeng').textContent = `오행 ▸ `+Object.entries(s.오행분포).map(([k,v])=>`${k} ${v}`).join('  ');
    document.getElementById('rDesc').innerHTML = paras(data.text);

    document.getElementById('cats').innerHTML = CATS.map(c=>`<button class="cat" data-c="${c}">${c}</button>`).join('');
    document.querySelectorAll('.cat').forEach(b=> b.onclick=()=>fetchSection(b.dataset.c, b, {}));
    document.getElementById('answer').innerHTML='';
    refreshChips();
  }

  function clearActive(){ document.querySelectorAll('.cat,.wide').forEach(x=>x.classList.remove('on')); }
  function hidePanels(){ document.getElementById('partner').classList.remove('show'); document.getElementById('gpanel').classList.remove('show'); }
  function labelOf(section){ return section==='이번달운세'?`${MONTH}월 운세`: section==='에겐테토'?'🧬 에겐·테토 판독':section; }

  async function fetchSection(section, btn, opt){
    clearActive(); btn.classList.add('on'); hidePanels();
    const ans=document.getElementById('answer');
    if(cache[section]){ ans.innerHTML=box(labelOf(section), cache[section], opt.color); return; }
    ans.innerHTML=dots(opt.loadMsg);
    try{
      const data=await callAPI({section});
      cache[section]=data.text; ans.innerHTML=box(labelOf(section), data.text, opt.color);
    }catch(e){ ans.innerHTML=`<div class="err">${e.message}</div>`; }
  }

  document.getElementById('btnMonth').onclick = (e)=> fetchSection('이번달운세', e.currentTarget, {});
  document.getElementById('btnPersona').onclick = (e)=> fetchSection('에겐테토', e.currentTarget, {color:'p', loadMsg:'판독 중'});

  // ── 1:1 궁합 ──
  document.getElementById('btnGung').onclick = (e)=>{
    const p=document.getElementById('partner'); const open=!p.classList.contains('show');
    clearActive(); hidePanels();
    if(open){ p.classList.add('show'); e.currentTarget.classList.add('on'); p.scrollIntoView({behavior:'smooth',block:'center'}); }
  };
  document.getElementById('goGung').onclick = async ()=>{
    const pb=document.getElementById('pBirth').value;
    const ans=document.getElementById('answer');
    if(!pb){ ans.innerHTML='<div class="err">상대방 생년월일을 입력해 주세요.</div>'; return; }
    const [y,m,d]=pb.split('-').map(Number);
    const hv=document.getElementById('pHour').value;
    const partner={ year:y,month:m,day:d, hourUnknown:hv==='unknown', hour:hv==='unknown'?12:Number(hv), minute:0 };
    const btn=document.getElementById('goGung'); btn.disabled=true; btn.textContent='궁합 보는 중...';
    ans.innerHTML=dots();
    try{
      const data=await callAPI({section:'궁합', relation, partner});
      let head='';
      if(data.partner){ head=`<div class="pair-head">나 ${data.saju.일간.hangul}${data.saju.일간.hanja} &nbsp;↔&nbsp; 상대 ${data.partner.일간.hangul}${data.partner.일간.hanja} &nbsp;·&nbsp; ${relation}</div>`; }
      ans.innerHTML = `<div class="box g"><div class="t">💞 ${relation} 궁합</div>${head}${paras(data.text)}</div>`;
    }catch(e){ ans.innerHTML=`<div class="err">${e.message}</div>`; }
    finally{ btn.disabled=false; btn.textContent='궁합 보기 →'; }
  };

  // ── 단체 케미 ──
  document.getElementById('btnGroup').onclick = (e)=>{
    const g=document.getElementById('gpanel'); const open=!g.classList.contains('show');
    clearActive(); hidePanels();
    if(open){ g.classList.add('show'); e.currentTarget.classList.add('on'); refreshChips(); g.scrollIntoView({behavior:'smooth',block:'center'}); }
  };
  function refreshChips(){
    if(!payload) return;
    const meName = payload.name || '나';
    const chips=[`<span class="chip me"><b>${esc(meName)}</b> (나)</span>`]
      .concat(groupMembers.map((m,i)=>`<span class="chip"><b>${esc(m.name)}</b> ${String(m.year).slice(2)}.${m.month}.${m.day}<span class="x" data-i="${i}">✕</span></span>`));
    document.getElementById('gChips').innerHTML=chips.join('');
    document.getElementById('gCount').textContent=`${1+groupMembers.length}/10`;
    document.querySelectorAll('#gChips .x').forEach(x=>x.onclick=()=>{ groupMembers.splice(Number(x.dataset.i),1); refreshChips(); });
  }
  document.getElementById('gAdd').onclick = ()=>{
    const ans=document.getElementById('answer');
    const gb=document.getElementById('gBirth').value;
    if(!gb){ ans.innerHTML='<div class="err">추가할 멤버의 생년월일을 입력해 주세요.</div>'; return; }
    if(1+groupMembers.length>=10){ ans.innerHTML='<div class="err">최대 10명까지 가능해요.</div>'; return; }
    const [y,m,d]=gb.split('-').map(Number);
    const hv=document.getElementById('gHour').value;
    const nm=document.getElementById('gName').value.trim() || `멤버${groupMembers.length+2}`;
    groupMembers.push({ name:nm, year:y, month:m, day:d, hourUnknown:hv==='unknown', hour:hv==='unknown'?12:Number(hv), minute:0 });
    document.getElementById('gName').value=''; document.getElementById('gBirth').value='';
    document.getElementById('gHour').value='unknown';
    ans.innerHTML=''; refreshChips();
  };
  async function runGroup(section, btnId, title, color, doneTxt){
    const ans=document.getElementById('answer');
    const members=[{ name:payload.name||'나', gender, year:payload.year, month:payload.month, day:payload.day,
      hour:payload.hour, minute:0, hourUnknown:payload.hourUnknown }, ...groupMembers];
    if(members.length<2){ ans.innerHTML='<div class="err">멤버를 1명 이상 추가해 주세요. (본인 포함 2~10명)</div>'; return; }
    const ck=section+'|'+JSON.stringify(members);
    if(cache[ck]){ ans.innerHTML=box(title, cache[ck], color); return; }
    const btn=document.getElementById(btnId); btn.disabled=true;
    ans.innerHTML=dots(`${members.length}명 분석 중 (10~30초)`);
    try{
      const data=await callAPI({section, members});
      cache[ck]=data.text; ans.innerHTML=box(title, data.text, color);
      ans.scrollIntoView({behavior:'smooth',block:'start'});
    }catch(e){ ans.innerHTML=`<div class="err">${e.message}</div>`; }
    finally{ btn.disabled=false; btn.textContent=doneTxt; }
  }
  document.getElementById('goGroup').onclick = ()=> runGroup('단체궁합','goGroup','🍻 단체 궁합','o','🍻 단체 궁합 보기 →');
  document.getElementById('goGroupPersona').onclick = ()=> runGroup('단체에겐테토','goGroupPersona','🧬 에겐·테토 단체 판독','p','🧬 에겐·테토 단체 판독 →');

  document.getElementById('reset').onclick = ()=>{
    payload=null; groupMembers=[]; for(const k in cache) delete cache[k]; clearActive(); hidePanels();
    document.getElementById('answer').innerHTML='';
    document.getElementById('result').style.display='none';
    document.getElementById('form').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
  };
</script>
</body>
</html>
