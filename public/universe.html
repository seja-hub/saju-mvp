<!DOCTYPE html>
<!-- 인연 유니버스 (DEMO) — 계산은 /api/pair(비용 0원)만 사용, 저장·DB 없음(새로고침 시 초기화) -->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>인연 유니버스 (DEMO)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{
    --gold:#ffd76a; --gold-d:#e8c877; --star-fr:#aecbff;
    --ink:#eef2fb; --sub:#93a3c8; --line:rgba(157,189,228,.22); --glass:rgba(255,255,255,.055);
    --navy:#003087; --blue:#004EA8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  input,button{font-family:inherit;}
  body{margin:0; color:var(--ink); min-height:100vh;
    background:linear-gradient(180deg,#040b20 0%,#081a40 48%,#0d2a63 100%);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.6; padding:0 0 56px;}
  #bgStars{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  #bgStars i{position:absolute; background:#fff; border-radius:50%; opacity:.7;
    animation:twk var(--t,3s) ease-in-out var(--dl,0s) infinite;}
  @keyframes twk{0%,100%{opacity:.15;} 50%{opacity:.85;}}
  .wrap{max-width:440px; margin:0 auto; padding:0 18px; position:relative; z-index:1;}

  header{text-align:center; padding:34px 0 16px;}
  .demo-pill{display:inline-block; font-size:10.5px; font-weight:900; letter-spacing:2px; color:#0a1330;
    background:linear-gradient(90deg,#ffd76a,#f0b13c); border-radius:999px; padding:4px 13px;}
  header h1{font-size:31px; margin:12px 0 6px; font-weight:900; letter-spacing:-.5px;
    background:linear-gradient(120deg,#fff 30%,var(--gold) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;}
  header p{margin:0; color:var(--sub); font-size:13.5px;}

  .sky{position:relative; margin:14px 0; border:1px solid var(--line); border-radius:24px;
    background:radial-gradient(circle at 50% 34%, rgba(0,78,168,.32) 0%, rgba(4,11,32,.1) 70%);
    overflow:hidden;}
  .sky svg{display:block; width:100%; height:auto;}
  .sky .empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--sub); font-size:13.5px; text-align:center; line-height:1.7; pointer-events:none;}
  .link{stroke:rgba(255,215,106,.5); stroke-width:1.2; stroke-dasharray:3 4; animation:fadein .8s ease;}
  .linklab{fill:var(--gold-d); font-size:11px; font-weight:800; letter-spacing:.3px; animation:fadein .8s ease;}
  .linkscore{fill:#7f92bd; font-size:9.5px; font-weight:600; animation:fadein .8s ease;}
  @keyframes fadein{from{opacity:0;} to{opacity:1;}}
  .star{transform-box:fill-box; transform-origin:center;}
  .star.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards;}
  @keyframes pop{0%{transform:scale(0);} 100%{transform:scale(1);}}
  .exchip-r{fill:rgba(255,255,255,.12); stroke:rgba(157,189,228,.4); stroke-width:.6;}
  .exchip-t{fill:#aabbdf; font-size:8.5px; font-weight:700; letter-spacing:1.5px;}
  .glyph{animation:starTw 2.8s ease-in-out infinite;}
  @keyframes starTw{0%,100%{opacity:1;} 50%{opacity:.62;}}
  .g-me{font-size:46px; fill:var(--gold); filter:drop-shadow(0 0 8px rgba(255,215,106,.85));}
  .g-fr{font-size:26px; fill:var(--star-fr); filter:drop-shadow(0 0 5px rgba(174,203,255,.75));}
  .sname{fill:var(--ink); font-size:12px; font-weight:700;}
  .sname.mine{fill:var(--gold); font-size:13px; font-weight:800;}
  .ilgan-line{text-align:center; font-size:13px; color:var(--gold-d); font-weight:700; margin:-4px 0 12px;
    min-height:20px;}

  .card{background:var(--glass); border:1px solid var(--line); border-radius:18px;
    padding:18px 16px; margin:12px 0; backdrop-filter:blur(3px);}
  .card .c-t{font-size:13.5px; font-weight:800; margin-bottom:11px; color:var(--ink);}
  .card .c-t .cnt{float:right; color:var(--sub); font-weight:600; font-size:12px;}
  .row{display:flex; gap:8px;}
  input{flex:1; min-width:0; padding:12px 13px; font-size:15px; border:1.5px solid var(--line);
    border-radius:11px; background:rgba(4,11,32,.5); color:var(--ink); appearance:none;
    transition:border-color .15s;}
  input::placeholder{color:#5e6f96;}
  input:focus{outline:none; border-color:var(--gold-d);}
  input[type=date]{color-scheme:dark;}
  .go{margin-top:9px; width:100%; padding:13px; font-size:14.5px; font-weight:800; border:none;
    border-radius:12px; cursor:pointer; color:#0a1330;
    background:linear-gradient(90deg,#ffd76a,#f0b13c); transition:transform .08s, opacity .15s;}
  .go:active{transform:scale(.98);}
  .go:disabled{opacity:.45;}
  .err{color:#ff9c94; font-size:12.5px; margin-top:8px; display:none;}

  .clear-ex{display:none; margin:0 auto 2px; background:rgba(255,255,255,.08); border:1px solid var(--line);
    color:var(--ink); font-size:12.5px; font-weight:700; border-radius:999px; padding:8px 18px; cursor:pointer;
    transition:transform .08s, background .15s;}
  .clear-ex:active{transform:scale(.96); background:rgba(255,255,255,.14);}

  .lrow{display:flex; gap:11px; align-items:flex-start; padding:10px 2px; border-bottom:1px solid rgba(157,189,228,.13);}
  .lrow:last-child{border-bottom:none; padding-bottom:2px;}
  .lrow:first-child{padding-top:2px;}
  .lstar{font-size:17px; line-height:1.35; flex-shrink:0; filter:drop-shadow(0 0 4px currentColor);}
  .lbody{flex:1; min-width:0;}
  .l1{display:flex; align-items:baseline; gap:7px; font-size:13.5px; flex-wrap:wrap;}
  .l1 b{color:#fff; font-weight:800;}
  .llab{color:var(--gold-d); font-weight:800; font-size:12.5px;}
  .lchem{margin-left:auto; color:#9db2dd; font-weight:800; font-size:12px; white-space:nowrap;}
  .l-basis{font-size:11px; color:var(--gold-d); opacity:.92; margin-top:3px; line-height:1.5;}
  .l2{font-size:11.5px; color:var(--sub); margin-top:2px; line-height:1.55;}

  .note{font-size:12px; color:var(--sub); text-align:center; line-height:1.75; margin:26px 4px 14px;}
  .saju-btn{display:block; text-align:center; text-decoration:none; padding:14px; border-radius:13px;
    background:transparent; border:1.5px solid var(--gold-d); color:var(--gold-d);
    font-size:14.5px; font-weight:800; transition:transform .08s;}
  .saju-btn:active{transform:scale(.98);}
</style>
</head>
<body>
<div id="bgStars"></div>
<div class="wrap">
  <header>
    <span class="demo-pill">미리보기 (DEMO)</span>
    <h1>인연 유니버스</h1>
    <p>내 별자리에 인연을 띄워보세요</p>
  </header>

  <button class="clear-ex" id="exClear">✨ 예시 지우고 내 별 띄우기</button>
  <div class="sky">
    <svg id="skySvg" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="empty" id="skyEmpty">아직 밤하늘이 비어 있어요<br>아래에서 내 별을 먼저 띄워주세요 ✦</div>
  </div>
  <div class="ilgan-line" id="ilganLine"></div>

  <div class="card" id="listCard" style="display:none">
    <div class="c-t">🌌 인연 리스트</div>
    <div id="listRows"></div>
  </div>

  <div class="card" id="meCard">
    <div class="c-t">① 내 별 띄우기</div>
    <div class="row">
      <input id="myName" type="text" placeholder="이름/별명" maxlength="8" />
      <input id="myBirth" type="date" min="1920-01-01" style="flex:1.4" />
    </div>
    <button class="go" id="myGo">✦ 내 별 띄우기</button>
    <div class="err" id="myErr"></div>
  </div>

  <div class="card" id="frCard" style="display:none">
    <div class="c-t">② 인연 추가 <span class="cnt" id="frCnt">0/4</span></div>
    <div class="row">
      <input id="frName" type="text" placeholder="이름/별명" maxlength="8" />
      <input id="frBirth" type="date" min="1920-01-01" style="flex:1.4" />
    </div>
    <button class="go" id="frGo">🌟 인연 별 띄우기</button>
    <div class="err" id="frErr"></div>
  </div>

  <p class="note">정식 버전에서는 링크를 받은 친구가 직접 자기 별을 올리고,<br>
    내 인연 유니버스가 계속 자라나요 — 향후 확장 기능 미리보기</p>
  <a class="saju-btn" href="saju.html">🍶 굿데이 사주 보러 가기</a>
</div>

<script>
  // 배경 잔별
  (function(){
    const box=document.getElementById('bgStars');
    let h='';
    for(let i=0;i<70;i++){
      const s=(Math.random()*1.6+.8).toFixed(1);
      h+=`<i style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;width:${s}px;height:${s}px;--t:${(Math.random()*3+2).toFixed(1)}s;--dl:${(Math.random()*4).toFixed(1)}s"></i>`;
    }
    box.innerHTML=h;
  })();

  const ME=[180,164];
  const SLOTS=[[80,64],[288,72],[48,196],[312,200],[178,304]];
  let me=null; const friends=[];

  /* ═══ 예시 유니버스 설정 — 데이터 한곳 관리 ═══
     예시 생년월일은 /api/pair 실제 계산으로 인연 유형이 다양하게 나오도록 고른 값 */
  const EX = {
    me: { name:'나 (예시)', birth:'1995-07-15' },
    friends: [
      { name:'김태양', birth:'1993-04-11' }, // 천간합 → 하늘이 묶어준 짝꿍
      { name:'이보라', birth:'1996-12-23' }, // 육합 → 내 옆자리 전담 단짝
      { name:'박도윤', birth:'1991-05-07' }, // 충 → 투닥투닥 평생 맞수
      { name:'최여름', birth:'1998-02-07' }, // 보완 → 충전 귀인/온기 인연
      { name:'정하늘', birth:'1994-06-07' }, // 무난 → 서서히 물들어가는 인연
    ],
  };

  /* ═══ 인연족보 — 유형 판정·문구 설정 한곳 관리 ═══
     우선순위: 천간합 > 육합 > 충 > 보완받음 > 보완줌 > 같은기운 > 무난
     {나일간}·{상대일간}·{오행}은 실제 데이터로 치환됨. short는 밤하늘 별 옆 축약 라벨 */
  const REL = {
    천간합: { label:'하늘이 묶어준 짝꿍', short:'묶인 짝꿍',
      basis:'{나일간}과 {상대일간}이 천간합으로 딱 붙는 구조 — 사주가 먼저 서로를 알아본 사이',
      drink:'첫 잔만 부딪혀도 텐션이 맞아 마지막까지 같이 남는 조합',
      daily:'연락이 뜸해도 어색함 제로, 만나면 어제 본 사이' },
    육합: { label:'내 옆자리 전담 단짝', short:'옆자리 단짝',
      basis:'일지끼리 육합 — 곁에 있을 때 가장 편안해지는 자리 배치',
      drink:'옆에 앉으면 잔이 저절로 채워지고 얘기가 끊기지 않는 사이',
      daily:'굳이 약속 안 잡아도 자연스럽게 자주 보게 되는 인연' },
    충: { label:'투닥투닥 평생 맞수', short:'평생 맞수',
      basis:'일지끼리 충(沖) — 부딪히는 만큼 서로에게 자극이 되는 구조',
      drink:'안주 하나로도 토론이 열리는 조합, 근데 제일 늦게까지 남는 건 이 둘',
      daily:'사사건건 의견은 갈려도 정작 큰일엔 제일 먼저 달려오는 사이' },
    보완받음: { label:'내 기운 충전 귀인', short:'충전 귀인',
      basis:'내게 없는 {오행} 기운을 가득 채워주는 사주 — 곁에 두면 이득',
      drink:'이 사람과 마시는 날은 이상하게 컨디션이 살아나는 날',
      daily:'지칠 때 만나면 배터리 충전되듯 기운 나는 인연' },
    보완줌: { label:'내 온기가 필요한 인연', short:'온기 인연',
      basis:'상대에게 없는 {오행} 기운을 내가 채워주는 구조 — 나 없인 허전할 사이',
      drink:'내가 챙겨줘야 마음이 놓이는데, 그게 싫지 않은 조합',
      daily:'은근히 나를 찾고 기대는, 지켜주고 싶은 인연' },
    같은기운: { label:'같은 물에서 자란 판박이', short:'판박이',
      basis:'일간 오행이 같은 {오행} 동족 — 설명이 필요 없는 케미',
      drink:'주종도 안주 취향도 겹쳐서 주문이 3초 만에 끝나는 사이',
      daily:'손발이 착착 맞아 뭘 해도 편한, 거울 같은 인연' },
    무난: { label:'서서히 물들어가는 인연', short:'물드는 인연',
      basis:'뚜렷한 합도 충도 없는 담백한 구조 — 시간이 빚어가는 사이',
      drink:'자극적이진 않지만 자리가 거듭될수록 편해지는 조합',
      daily:'급하지 않게, 오래 두고 볼수록 진가가 나오는 인연' },
  };
  const EL_STAR = {목:'#4cc98a',화:'#ff7a6e',토:'#ffc457',금:'#c3cbd8',수:'#6ea8ff'};
  function chemOf(score){ return Math.min(98, 62 + score*4); } // 케미 지수 환산
  function ilganName(i){ return i.hangul + i.오행; } // 예: 정+화 → 정화

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function showErr(id,msg){ const e=document.getElementById(id); e.textContent=msg; e.style.display=msg?'block':'none'; }
  function parseBirth(v){ const [y,m,d]=v.split('-').map(Number); return {year:y,month:m,day:d,hourUnknown:true,hour:12,minute:0}; }

  async function callPair(a,b){
    const res=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({a,b})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'계산에 실패했어요');
    return data;
  }

  // 인연족보 유형 판정 — 우선순위: 천간합 > 육합 > 충 > 보완받음 > 보완줌 > 같은기운 > 무난
  function relTexts(r){
    const combos=r.combos||[];
    let key='무난', els=null;
    if(combos.some(c=>c.startsWith('천간합'))) key='천간합';
    else if(combos.some(c=>c.startsWith('육합'))) key='육합';
    else if(combos.some(c=>c.startsWith('충'))) key='충';
    else if(r.fillBtoA && r.fillBtoA.length){ key='보완받음'; els=r.fillBtoA; }
    else if(r.fillAtoB && r.fillAtoB.length){ key='보완줌'; els=r.fillAtoB; }
    else if(r.same) key='같은기운';
    const cfg=REL[key];
    // 받침 유무에 따라 조사 선택 (과/와, 이/가)
    const josa=(w,withBat,noBat)=>{
      const c=w.charCodeAt(w.length-1);
      if(c<0xAC00||c>0xD7A3) return withBat;
      return ((c-0xAC00)%28===0) ? noBat : withBat;
    };
    const na=ilganName(r.aIlgan), sang=ilganName(r.bIlgan);
    const sub=s=>s
      .replace('{나일간}과', na+josa(na,'과','와'))
      .replace('{상대일간}이', sang+josa(sang,'이','가'))
      .replace('{나일간}', na)
      .replace('{상대일간}', sang)
      .replace('{오행}', els ? els.join('·') : r.aIlgan.오행);
    return { key, label:cfg.label, short:cfg.short, basis:sub(cfg.basis), drink:cfg.drink, daily:cfg.daily };
  }

  function exChip(x,y){
    return `<rect class="exchip-r" x="${x-16}" y="${y-7}" width="32" height="13" rx="6.5"/>
      <text class="exchip-t" x="${x}" y="${y+3}" text-anchor="middle">예시</text>`;
  }
  function starG(x,y,name,mine,fresh,example){
    return `<g class="star${fresh?' pop':''}">
      <text x="${x}" y="${y}" class="glyph ${mine?'g-me':'g-fr'}" text-anchor="middle" dominant-baseline="central">✦</text>
      <text x="${x}" y="${y+(mine?36:26)}" class="sname${mine?' mine':''}" text-anchor="middle">${esc(name)}</text>
      ${example?exChip(x, y-(mine?36:26)):''}
    </g>`;
  }
  function render(){
    const svg=document.getElementById('skySvg');
    document.getElementById('skyEmpty').style.display = me ? 'none' : 'flex';
    if(!me){ svg.innerHTML=''; return; }
    let s='';
    friends.forEach((f,i)=>{
      const [x,y]=SLOTS[i];
      const mx=(ME[0]+x)/2, my=(ME[1]+y)/2;
      const fr=f.fresh?' style="animation:fadein .8s ease"':' style="animation:none"';
      s+=`<line class="link" x1="${ME[0]}" y1="${ME[1]}" x2="${x}" y2="${y}"${fr}/>`;
      s+=`<text class="linklab" x="${mx}" y="${my-5}" text-anchor="middle"${fr}>${esc(f.short)}</text>`;
      s+=`<text class="linkscore" x="${mx}" y="${my+9}" text-anchor="middle"${fr}>케미 ${f.chem}</text>`;
    });
    s+=starG(ME[0],ME[1],me.name,true,me.fresh,me.example); me.fresh=false;
    friends.forEach((f,i)=>{ const [x,y]=SLOTS[i]; s+=starG(x,y,f.name,false,f.fresh,f.example); f.fresh=false; });
    svg.innerHTML=s;
  }
  function renderList(){
    const card=document.getElementById('listCard');
    if(!friends.length){ card.style.display='none'; return; }
    card.style.display='block';
    document.getElementById('listRows').innerHTML = friends.map(f=>
      `<div class="lrow">
        <span class="lstar" style="color:${EL_STAR[f.el]||'#aecbff'}">✦</span>
        <div class="lbody">
          <div class="l1"><b>${esc(f.name)}</b><span class="llab">${esc(f.label)}</span><span class="lchem">케미 ${f.chem}</span></div>
          <div class="l-basis">${esc(f.basis)}</div>
          <div class="l2">🍶 ${esc(f.drink)}</div>
          <div class="l2">☀️ ${esc(f.daily)}</div>
        </div>
      </div>`).join('');
  }

  document.getElementById('myGo').onclick=async ()=>{
    showErr('myErr','');
    const bv=document.getElementById('myBirth').value;
    if(!bv){ showErr('myErr','생년월일을 입력해 주세요.'); return; }
    const btn=document.getElementById('myGo'); btn.disabled=true; btn.textContent='별 띄우는 중...';
    try{
      const p=parseBirth(bv);
      const r=await callPair(p,p); // 같은 사람을 넣어 내 일간만 계산 (Gemini 미사용)
      me={ name:document.getElementById('myName').value.trim()||'나', ...p, fresh:true, example:false };
      document.getElementById('ilganLine').textContent =
        `내 별 · 일간 ${r.aIlgan.hangul}(${r.aIlgan.hanja}) — ${r.aIlgan.오행}의 기운`;
      document.getElementById('meCard').style.display='none';
      document.getElementById('frCard').style.display='block';
      render();
    }catch(e){ showErr('myErr',e.message); }
    finally{ btn.disabled=false; btn.textContent='✦ 내 별 띄우기'; }
  };

  document.getElementById('frGo').onclick=async ()=>{
    showErr('frErr','');
    if(friends.length>=4){ showErr('frErr','데모에서는 최대 4명까지 띄울 수 있어요.'); return; }
    const bv=document.getElementById('frBirth').value;
    if(!bv){ showErr('frErr','인연의 생년월일을 입력해 주세요.'); return; }
    const btn=document.getElementById('frGo'); btn.disabled=true; btn.textContent='인연 찾는 중...';
    try{
      const p=parseBirth(bv);
      const r=await callPair({year:me.year,month:me.month,day:me.day,hourUnknown:true}, p);
      friends.push({ name:document.getElementById('frName').value.trim()||`별${friends.length+1}`,
        ...p, score:r.score, chem:chemOf(r.score), el:r.bIlgan.오행, ...relTexts(r), example:false, fresh:true });
      document.getElementById('frName').value=''; document.getElementById('frBirth').value='';
      document.getElementById('frCnt').textContent=`${friends.length}/4`;
      render(); renderList();
    }catch(e){ showErr('frErr',e.message); }
    finally{ btn.disabled=false; btn.textContent='🌟 인연 별 띄우기'; }
  };

  // ── 예시 유니버스 프리로드 / 초기화 ──
  function resetToEmpty(){
    me=null; friends.length=0;
    document.getElementById('exClear').style.display='none';
    document.getElementById('meCard').style.display='block';
    document.getElementById('frCard').style.display='none';
    document.getElementById('listCard').style.display='none';
    document.getElementById('ilganLine').textContent='';
    document.getElementById('frCnt').textContent='0/4';
    render();
  }
  document.getElementById('exClear').onclick=resetToEmpty;

  (async function preloadExample(){
    try{
      const mp=parseBirth(EX.me.birth);
      const r0=await callPair(mp,mp);
      me={ name:EX.me.name, ...mp, fresh:true, example:true };
      document.getElementById('ilganLine').textContent =
        `내 별 · 일간 ${r0.aIlgan.hangul}(${r0.aIlgan.hanja}) — ${r0.aIlgan.오행}의 기운 (예시)`;
      document.getElementById('meCard').style.display='none';
      document.getElementById('exClear').style.display='block';
      render();
      for(const ef of EX.friends){
        const p=parseBirth(ef.birth);
        const r=await callPair(mp,p);
        if(!me || !me.example) return; // 로딩 중 사용자가 예시를 지운 경우 중단
        friends.push({ name:ef.name, ...p, score:r.score, chem:chemOf(r.score),
          el:r.bIlgan.오행, ...relTexts(r), example:true, fresh:true });
        render(); renderList();
        await new Promise(res=>setTimeout(res,380)); // 순차 팝 등장
      }
    }catch(e){ resetToEmpty(); } // API 실패 시 빈 입력 플로우로
  })();
</script>
</body>
